<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove it</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
    </div>

    <div id="spawn-area">
      <div id="message">Click "Start" to begin</div>
    </div>
    
    <div id="hi-overlay" class="hi-overlay">
      <div class="hi-content">
        <img src="./assets/intro.jpg" alt="Intro" class="hi-image" />
        <div class="hi-text">HI</div>
      </div>
    </div>

    <!-- Add intro audio with multiple formats for better compatibility -->
    <audio id="intro-audio" preload="auto">
      <source src="./assets/intro.mp3" type="audio/mpeg">
      <source src="./assets/intro.wav" type="audio/wav">
      <source src="./assets/intro.ogg" type="audio/ogg">
    </audio>

    <!-- Debug panel - required for the debug functionality -->
    <div id="debug-panel" class="debug-panel">
      <div>Stage: <span id="debug-stage">0</span></div>
      <div>Assets: <span id="debug-assets">0</span></div>
      <div>Command: <span id="debug-command">none</span></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
