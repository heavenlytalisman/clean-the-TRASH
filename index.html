<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice-Prank Trash Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
    
  <div class="container">
    <h1>🗑️ Voice Trash Cleaner 🎤</h1>
      <div id="status" class="status">Click "Start" to begin cleaning!</div>
      <div id="instructions" class="instructions">Get ready for an eco-friendly voice adventure!</div>
        
      <div class="volume-bar">
        <div id="volumeFill" class="volume-fill"></div>
      </div>
        
      <div id="trashCounter" class="trash-counter">Trash Count: 0</div>
        
      <button id="startBtn">🎯 Start Cleaning</button>
      <button id="resetBtn">🔄 Reset</button>
  <script src="app.js"></script>
</body>
</html>
